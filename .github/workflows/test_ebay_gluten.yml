    if: >
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[DEPLOY]')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[DEPLOY]'))
    needs: [build-native-lib-centos-7, build-internal-dependency]
    runs-on: ubuntu-22.04
    env:
      OAUTH_KEY: ${{ secrets.OAUTH_KEY }}
    container: centos:8
    steps:
      - uses: actions/checkout@v2
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: velox-native-lib-centos-7-${{github.sha}}
          path: ./cpp/build/releases
      - name: Download m2 dependency
        uses: actions/download-artifact@v4
        with:
          name: m2-dependency-${{github.sha}}
          path: /root/.m2/repository
      - name: Download Arrow Jars
        uses: actions/download-artifact@v4
        with:
          name: arrow-jars-centos-7-${{github.sha}}
          path: /root/.m2/repository/org/apache/arrow/
      - name: Setup Java and Maven
        run: |
          sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*
          yum install -y java-17-openjdk-devel
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          export PATH=$JAVA_HOME/bin:$PATH
          wget https://dlcdn.apache.org/maven/maven-3/3.8.9/binaries/apache-maven-3.8.9-bin.tar.gz
          tar -xvf apache-maven-3.8.9-bin.tar.gz
          mv apache-maven-3.8.9 /usr/lib/maven
      - name: Build for eBay Spark 3.5
        run: |
          cd $GITHUB_WORKSPACE/ && \
          export MAVEN_HOME=/usr/lib/maven && \
          export PATH=${PATH}:${MAVEN_HOME}/bin && \
          mvn clean install -Pspark-3.5 -Dhadoop.version=3.3.3.1.0.39 -Pbackends-velox -Pceleborn -Piceberg -Pdelta -DskipTests=true -Dmaven.javadoc.skip=true -Dmaven.scaladoc.skip=true -Dmaven.source.skip -Dcyclonedx.skip=true
          sed -i.bak '/<parent>/,/<\/parent>/d' pom.xml
          mvn -s ./.github/settings.xml clean deploy -Pspark-3.5 -Dhadoop.version=3.3.3.1.0.39 -Pbackends-velox -Pceleborn -Piceberg -Pdelta -DskipTests=true -Dmaven.javadoc.skip=true -Dmaven.scaladoc.skip=true -Dmaven.source.skip -Dcyclonedx.skip=true
          ls -lh package/target/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload bundle package
        uses: actions/upload-artifact@v4
        with:
          name: gluten-velox-bundle-package
          path: package/target/gluten-velox-bundle-*.jar
          retention-days: 3
          if-no-files-found: error
      - name: Build for ebay Spark 3.5 with scala 2.13
        run: |
          cd $GITHUB_WORKSPACE/ && \
          export MAVEN_HOME=/usr/lib/maven && \
          export PATH=${PATH}:${MAVEN_HOME}/bin && \
          export SPARK_SCALA_VERSION=2.13 && \
          mvn clean install -Pspark-3.5 -Pscala-2.13 -Dhadoop.version=3.3.3.1.0.39 -Pbackends-velox -Pceleborn -Piceberg -Pdelta -DskipTests=true -Dmaven.javadoc.skip=true -Dmaven.scaladoc.skip=true -Dmaven.source.skip -Dcyclonedx.skip=true
          sed -i.bak '/<parent>/,/<\/parent>/d' pom.xml
          sed -i 's/<artifactId>gluten-package_2\.12<\/artifactId>/<artifactId>gluten-package_2\.13<\/artifactId>/' package/pom.xml
          mvn -s ./.github/settings.xml clean deploy -Pspark-3.5 -Pscala-2.13 -Dhadoop.version=3.3.3.1.0.39 -Pbackends-velox -Pceleborn -Piceberg -Pdelta -DskipTests=true -Dmaven.javadoc.skip=true -Dmaven.scaladoc.skip=true -Dmaven.source.skip -Dcyclonedx.skip=true
          ls -lh package/target/
          md5sum package/target/gluten-velox-bundle-spark3.5*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload bundle package with scala 2.13
        uses: actions/upload-artifact@v4
        with:
          name: gluten-velox-bundle-package-scala2.13
          path: package/target/gluten-velox-bundle-*.jar
          retention-days: 3
          if-no-files-found: error