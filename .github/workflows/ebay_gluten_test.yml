          fail-on-cache-miss: false

      - name: Download Native Lib (fallback)
        if: inputs.native_lib_run_id == '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v3
        with:
          name: velox-native-lib-centos-7-${{ github.sha }}
          path: ./cpp/build/releases

      - name: Download Native Lib (reuse)
        if: inputs.native_lib_run_id != ''
        run: |
          mkdir -p cpp/build/releases/
          ARTIFACT_ID=$(curl -fsSL \
            -H "Authorization: token ${{ github.token }}" \
            "https://github.corp.ebay.com/api/v3/repos/${{ github.repository }}/actions/runs/${{ inputs.native_lib_run_id }}/artifacts?per_page=100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['id'] for a in d['artifacts'] if 'velox-native-lib' in a['name']))")
          curl -fsSL \
            -H "Authorization: token ${{ github.token }}" \
