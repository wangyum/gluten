name: Delta VACUUM Safety Test (Velox)

# Verifies that VACUUM on a Delta table produces correct results when Gluten is
# enabled and built WITHOUT -Pdelta.
#
# Root cause: without -Pdelta, OffloadOthers sends the _delta_log checkpoint
# scan to Velox, which misreads SingleAction Parquet and returns no AddFile rows.
# VacuumCommand then computes an empty validFiles set and deletes every live file.
#
# Fix: FallbackDeltaLogScan (in backends-velox, always active) detects scans
# backed by DeltaLogFileIndex and forces JVM fallback before OffloadOthers runs.

on:
  push:
    branches:
      - main-ebay
    paths:
      - 'backends-velox/src/main/scala/org/apache/gluten/extension/FallbackDeltaLogScan.scala'
      - 'backends-velox/src/main/scala/org/apache/gluten/backendsapi/velox/VeloxRuleApi.scala'
      - 'backends-velox/src/test/scala/org/apache/gluten/execution/VeloxDeltaVacuumSuite.scala'
      - '.github/workflows/velox_delta_vacuum.yml'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  MVN_CMD: 'build/mvn -ntp'
  CCACHE_DIR: "${{ github.workspace }}/.ccache"

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # ── 1. Build Velox native library (with ccache) ─────────────────────────────
  build-native-lib:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get Ccache
        uses: actions/cache/restore@v4
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-centos7-release-default-${{ github.sha }}
          restore-keys: |
            ccache-centos7-release-default

      - name: Build Gluten native libraries
        run: |
          docker run -v $GITHUB_WORKSPACE:/work -w /work apache/gluten:vcpkg-centos-7-gcc13 bash -c "
            set -e
            yum install tzdata -y
            df -a
            cd /work
            export CCACHE_DIR=/work/.ccache
            export CCACHE_MAXSIZE=1G
            mkdir -p /work/.ccache
            ccache -sz
            bash dev/ci-velox-buildstatic-centos-7.sh
            ccache -s
          "

      - name: Save Ccache
        if: always()
        uses: actions/cache/save@v4
        id: ccache
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-centos7-release-default-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: velox-native-lib-delta-vacuum-${{ github.sha }}
          path: ./cpp/build/
          if-no-files-found: error

  # ── 2. Build eBay-internal dependencies (Spark + Hadoop jars) ───────────────
  build-internal-dependency:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore Maven cache
        id: m2cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-

      - name: Checkout packages repo
        if: ${{ !steps.m2cache.outputs.cache-hit }}
        uses: actions/checkout@v4
        with:
          repository: wangyum/packages
          ref: master
          token: ${{ secrets.EBAY_TOKEN }}

      - name: Install packages
        if: ${{ !steps.m2cache.outputs.cache-hit }}
        run: |
          mkdir -p /home/runner/.m2/repository
          rm -rf /home/runner/.m2/repository/io && rm -rf /home/runner/.m2/repository/org
          mv io /home/runner/.m2/repository/
          mv org /home/runner/.m2/repository/
          cd /home/runner/.m2/repository && find . -name "_*.repositories" | xargs rm -rf

      - name: Checkout ebay-spark repo
        if: ${{ !steps.m2cache.outputs.cache-hit }}
        uses: actions/checkout@v4
        with:
          repository: wangyum/ebay-spark
          ref: gluten-build
          token: ${{ secrets.EBAY_TOKEN }}

      - name: Install ebay-spark
        if: ${{ !steps.m2cache.outputs.cache-hit }}
        run: |
          build/mvn clean install -Dhadoop.version=3.3.3.1.0.39 -DskipTests=true -Dmaven.javadoc.skip=true
          ./dev/change-scala-version.sh 2.13
          build/mvn clean install -Pscala-2.13 -Dhadoop.version=3.3.3.1.0.39 -DskipTests=true -Dmaven.javadoc.skip=true

      - name: Save Maven cache
        if: ${{ !steps.m2cache.outputs.cache-hit }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}

      - uses: actions/upload-artifact@v4
        with:
          name: m2-dependency-${{ github.sha }}
          path: /home/runner/.m2/repository
          if-no-files-found: error

  # ── 3. Run VeloxDeltaVacuumSuite WITHOUT -Pdelta ────────────────────────────
  delta-vacuum-test:
    needs: [build-native-lib, build-internal-dependency]
    runs-on: ubuntu-22.04
    container: apache/gluten:centos-9-jdk17
    env:
      SPARK_TESTING: true

    steps:
      - uses: actions/checkout@v4

      - name: Download Native Lib
        uses: actions/download-artifact@v4
        with:
          name: velox-native-lib-delta-vacuum-${{ github.sha }}
          path: ./cpp/build/

      - name: Download m2 dependency
        uses: actions/download-artifact@v4
        with:
          name: m2-dependency-${{ github.sha }}
          path: /root/.m2/repository

      - name: Prepare Spark Resources
        run: |
          rm -rf /opt/shims/spark35
          bash .github/workflows/util/install-spark-resources.sh 3.5

      # Intentionally NO -Pdelta: the bug only manifests when Delta's
      # OffloadDeltaScan rule is absent.  The fix (FallbackDeltaLogScan) must
      # work without -Pdelta, and so must the tests.
      - name: Maven Build (no -Pdelta)
        run: |
          set -e
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          export PATH=$JAVA_HOME/bin:$PATH
          $MVN_CMD clean install \
            -Pspark-3.5 -Pjava-17 -Pbackends-velox -Piceberg \
            -DskipTests \
            -T 4

      - name: Run VeloxDeltaVacuumSuite
        run: |
          set -o pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          export PATH=$JAVA_HOME/bin:$PATH
          $MVN_CMD test \
            -pl backends-velox \
            -Pspark-3.5 -Pjava-17 -Pbackends-velox -Piceberg -Pspark-ut \
            -Dtest=VeloxDeltaVacuumSuite \
            -DfailIfNoTests=false \
            -DargLine="-Dspark.test.home=/opt/shims/spark35/spark_home/" \
            2>&1 | tee delta-vacuum-test-output.log

      - name: Parse test results
        if: always()
        run: |
          echo "========================================="
          echo "  VeloxDeltaVacuumSuite (no -Pdelta)"
          echo "========================================="
          grep -E "Tests run:|BUILD " delta-vacuum-test-output.log || echo "(no summary found)"
          grep -B1 "<<< FAIL!" delta-vacuum-test-output.log || echo "(no failures)"
          grep -B1 "<<< ERROR!" delta-vacuum-test-output.log || echo "(no errors)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-vacuum-test-report-${{ github.sha }}
          path: |
            **/surefire-reports/TEST-*VeloxDeltaVacuumSuite*.xml
            delta-vacuum-test-output.log

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: delta-vacuum-test-logs-${{ github.sha }}
          path: |
            **/target/*.log
            **/hs_err_*.log
